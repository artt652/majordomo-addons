name: probe market json
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe }
      - name: fetch
        run: |
          mkdir -p out2
          UA='Mozilla/5.0 (addons-catalog probe)'
          S='serial=0000000000&locale=ru&os=Linux'
          get() { curl -sS -m 90 -A "$UA" -D "out2/$1.headers" "$2" -o "out2/$1.body" || echo "curl failed $?" > "out2/$1.err"; }
          for host in connect.smartliving.ru connect.majordomohome.com; do
            h=$(echo "$host" | cut -d. -f2)
            get "${h}_all"     "https://$host/market/?lang=ru&$S&all=1"
            get "${h}_custom"  "https://$host/market/?lang=ru&$S&c[]=tinyfm&c[]=ivona_tts&c[]=sanotts"
            get "${h}_inst"    "https://$host/market/?lang=ru&$S&m[]=tinyfm&m[]=ivona_tts&m[]=sanotts"
            get "${h}_search"  "https://$host/market/?lang=ru&$S&search=tinyfm"
          done
          for n in tinyfm sanotts; do
            curl -sS -m 90 -A "$UA" -L -D "out2/dl_$n.headers" -r 0-2047 \
              "https://connect.smartliving.ru/market/?op=download&name=$n&$S" -o "out2/dl_$n.body" || true
          done
          ls -la out2
      - name: commit
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add out2; git commit -qm "probe 2 results"; git push -q origin HEAD:probe
